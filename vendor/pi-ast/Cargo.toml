[package]
name = "pi-ast"
version = "18.9.1"
edition = "2024"
license = "MIT"
authors = ["Stencil Labs, Inc."]
description = "Vendored from can1357/oh-my-pi (MIT), see ../LICENSE-oh-my-pi."

[dependencies]
anyhow = "1"
ast-grep-core = { version = "0.39", default-features = false, features = ["tree-sitter"] }
globset = "0.4"
ignore = "0.4"
phf = { version = "0.14", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-diff = "0.1"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-regex = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh32"] }
