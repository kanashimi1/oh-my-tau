     palette: dusk plum ramp, amber, far-city slate, near-city ink. -->
<rect width="1920" height="430" fill="#201a3a"/>
<rect y="430" width="1920" height="210" fill="#4b2b52"/>
<rect y="640" width="1920" height="120" fill="#9c5a60"/>
<circle cx="1210" cy="640" r="110" fill="#f5b26b"/>
<!-- far city -->
<g fill="#3c2f5c">
  <rect x="0" y="690" width="120" height="70"/>
  <rect x="130" y="650" width="90" height="110"/>
  <rect x="230" y="700" width="150" height="60"/>
  <rect x="390" y="620" width="110" height="140"/>
