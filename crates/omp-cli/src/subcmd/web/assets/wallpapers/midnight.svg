<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
<!-- Midnight aurora: the curtain sweeps in from the top-right as long tapering
     streaks of light, one rose streak low near the horizon; the ridge and a
     watcher's tent below, light mirrored in still water.
     Flat shapes only; palette: night navy, aurora greens, ice, one rose, ink. -->
<rect width="1920" height="700" fill="#0a0e1c"/>
<rect y="700" width="1920" height="380" fill="#0c1222"/>
<g fill="#d6f2e6" opacity=".55">
  <circle cx="140" cy="110" r="1.6"/><circle cx="230" cy="220" r="1.3"/><circle cx="320" cy="90" r="1.8"/>
  <circle cx="410" cy="180" r="1.2"/><circle cx="520" cy="140" r="1.5"/><circle cx="90" cy="320" r="1.3"/>
  <circle cx="180" cy="430" r="1.1"/><circle cx="1770" cy="420" r="1.2"/><circle cx="1660" cy="240" r="1.2"/>
  <circle cx="1840" cy="380" r="1.4"/><circle cx="60" cy="560" r="1"/>
</g>
<!-- the curtain -->
<g>
  <path fill="#1f8a6e" d="M1973,-201 L2033,-63 L183,661 L177,649 Z"/>
  <path fill="#37c99a" d="M2000,-193 L2048,-83 L333,616 L327,604 Z"/>
  <path fill="#1f8a6e" d="M2026,-189 L2070,-95 L503,591 L497,579 Z"/>
  <path fill="#d6f2e6" d="M2050,-180 L2093,-98 L673,611 L667,599 Z"/>
  <path fill="#37c99a" d="M2074,-167 L2117,-97 L844,661 L836,649 Z"/>
  <path fill="#1f8a6e" d="M2097,-158 L2139,-99 L1004,686 L996,674 Z"/>
  <path fill="#d6f2e6" d="M2120,-158 L2158,-109 L1154,651 L1146,639 Z"/>
  <path fill="#c8648f" d="M1827,184 L1873,228 L1405,677 L1395,667 Z"/>
  <path fill="#37c99a" d="M1909,309 L1947,334 L1706,682 L1694,674 Z"/>
</g>
<!-- ridge -->
<path fill="#05070f" d="M0,690 L220,668 L420,680 L560,646 L760,676 L960,660 L1160,682 L1360,664 L1520,606 L1700,662 L1920,648 L1920,700 L0,700 Z"/>
<!-- watcher's tent on the shore -->
<path fill="#05070f" d="M340,698 L376,656 L412,698 Z"/>
<path fill="#d6f2e6" d="M364,698 L376,672 L388,698 Z"/>
<!-- light on the still water -->
<g>
  <path fill="#1f8a6e" opacity=".16" d="M236,712 L264,712 L260,880 L240,880 Z"/>
  <path fill="#37c99a" opacity=".14" d="M366,716 L390,716 L386,846 L370,846 Z"/>
  <path fill="#d6f2e6" opacity=".16" d="M530,718 L552,718 L548,918 L534,918 Z"/>
  <path fill="#37c99a" opacity=".12" d="M700,722 L720,722 L716,812 L704,812 Z"/>
  <path fill="#1f8a6e" opacity=".13" d="M864,726 L884,726 L880,798 L868,798 Z"/>
  <path fill="#d6f2e6" opacity=".12" d="M1030,728 L1048,728 L1044,786 L1034,786 Z"/>
  <path fill="#c8648f" opacity=".15" d="M1290,706 L1312,706 L1306,822 L1296,822 Z"/>
</g>
</svg>
