name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-24.04-arm
          - os: windows-latest
            continue-on-error: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.continue-on-error || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The prebuilt onnxruntime (ort) calls `__isPlatformVersionAtLeast`, which
      # lives in clang's compiler-rt; rustc links with -nodefaultlibs, so add it.
      - name: macOS compiler-rt
        if: runner.os == 'macOS'
        shell: sh
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=13.4" >> "$GITHUB_ENV"
          echo "OMT_MAC_LINK=-C link-arg=$(xcrun clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a" >> "$GITHUB_ENV"
      - shell: sh
        run: RUSTFLAGS="${OMT_MAC_LINK:-}" cargo build --release -p omp-cli

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: scripts/build-musl.sh x86_64
      - name: Static and runs
        run: |
          file target/x86_64-unknown-linux-musl/release/omt | grep -q "statically linked"
          target/x86_64-unknown-linux-musl/release/omt --version
