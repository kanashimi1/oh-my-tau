[package]
name = "omp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omt"
path = "src/main.rs"

[dependencies]
mimalloc = "0.1"
omp-urls = { path = "../omp-urls" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
pa-types.workspace = true
pa-ai.workspace = true
pa-agent.workspace = true
regex = "1"
ignore = "0.4"
globset = "0.4"
omp-providers = { path = "../omp-providers" }
omp-session = { path = "../omp-session" }
omp-ext = { path = "../omp-ext" }
omp-compact = { path = "../omp-compact" }
omp-task = { path = "../omp-task" }
omp-eval = { path = "../omp-eval" }
omp-mcp = { path = "../omp-mcp" }
omp-lsp = { path = "../omp-lsp" }
omp-judge = { path = "../omp-judge" }
tracing = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2"] }
serde_yaml_ng = "0.10"
rand = "0.8"
parking_lot = "0.12"
sha2 = "0.10"
async-trait = "0.1"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
pi-ast = { path = "../../vendor/pi-ast" }
pi-edit = { path = "../../vendor/pi-edit" }
pi-walker = { path = "../../vendor/pi-walker" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

omp-settings = { path = "../omp-settings" }
omp-tui = { path = "../omp-tui" }
omp-stats = { path = "../omp-stats" }
omp-collab = { path = "../omp-collab" }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
flate2 = "1"
# `omp-rs web`: browser UI server (HTTP + WebSocket bridge to `--mode rpc` children).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
futures.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Landlock + seccomp confinement for tool subprocesses (`/sandbox`,
# features/sandbox.rs); omt re-executes itself as the confinement launcher.
omp-sandbox = { path = "../omp-sandbox" }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }

[lints]
workspace = true
