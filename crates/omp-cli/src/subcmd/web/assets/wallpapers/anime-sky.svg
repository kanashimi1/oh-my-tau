<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
<!-- Summer sky: one towering flat-shaded cumulus over an open cobalt field.
     Flat shapes only; palette: cobalt sky, pale horizon band, cloud white, cloud shadow, ink. -->
<rect width="1920" height="880" fill="#3573c3"/>
<rect y="880" width="1920" height="200" fill="#8db8e8"/>
<!-- distant flat cloud bank in the open gap above the horizon -->
<path fill="#e9f2fb" d="M520,866 C560,846 640,842 720,852 C770,858 800,862 830,868 Z"/>
<!-- the cumulus tower -->
<path fill="#f8fbfd" d="M780,880
  C770,812 800,748 862,712
  C858,640 896,568 968,540
  C972,458 1030,386 1112,372
  C1120,290 1180,232 1262,236
  C1350,240 1412,304 1418,384
  C1490,404 1544,462 1552,540
  C1626,568 1668,632 1664,706
  C1720,742 1746,806 1736,880 Z"/>
<!-- flat shadow: base wedges and under-billow crescents -->
<g fill="#c6ddf4">
  <path d="M788,880 C800,822 850,788 912,790 C940,792 968,806 990,830 L1050,880 Z"/>
  <path d="M1560,880 C1580,816 1636,790 1700,806 C1726,830 1740,854 1738,880 Z"/>
  <path d="M1150,430 C1180,400 1240,392 1290,410 C1250,428 1190,434 1150,430 Z"/>
  <path d="M1460,520 C1490,498 1530,496 1560,512 C1528,524 1488,526 1460,520 Z"/>
  <path d="M905,600 C930,578 972,574 1002,590 C970,602 932,604 905,600 Z"/>
</g>
<!-- companion cloud -->
<path fill="#f8fbfd" d="M240,600 C240,560 274,532 318,534 C330,502 368,484 406,494 C448,502 472,534 468,568 C494,578 504,600 498,620 L250,620 C242,616 240,608 240,600 Z"/>
<path fill="#c6ddf4" d="M262,620 C280,600 310,592 342,598 L360,620 Z"/>
<!-- sliver and cloudlets -->
<path fill="#f8fbfd" d="M580,798 C596,780 628,774 654,782 C676,776 700,784 706,798 C712,808 706,816 692,818 L606,818 C588,816 576,810 580,798 Z"/>
<path fill="#f8fbfd" d="M440,312 C452,296 486,290 512,298 C528,302 536,310 532,318 L452,320 C444,318 440,316 440,312 Z"/>
<path fill="#f8fbfd" d="M1560,188 C1570,174 1598,168 1620,176 C1634,180 1642,188 1638,196 L1572,196 C1564,194 1560,192 1560,188 Z"/>
<!-- two swifts -->
<g stroke="#1d3a5f" stroke-width="3.5" fill="none" stroke-linecap="round">
  <path d="M415,390 Q430,374 445,388"/>
  <path d="M445,388 Q460,374 475,390"/>
  <path d="M498,432 Q510,420 522,431"/>
  <path d="M522,431 Q534,420 546,432"/>
</g>
</svg>
