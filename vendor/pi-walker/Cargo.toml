[package]
name = "pi-walker"
version = "18.9.1"
edition = "2024"
license = "MIT"
authors = ["Stencil Labs, Inc."]
description = "Vendored from can1357/oh-my-pi (MIT), see ../LICENSE-oh-my-pi."

[dependencies]
pi-vfs = { path = "../pi-vfs" }
globset = "0.4"
ignore = "0.4"
parking_lot = "0.12"
rayon = "1.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }
