[package]
name = "omp-stats"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rust port of @oh-my-pi/omp-stats: session-log ingest into sqlite, rollups, dashboard JSON API and the local web dashboard server"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
fancy-regex = "0.14"
walkdir = "2"
pa-types.workspace = true
pa-models = { path = "../../vendor/pa-models" }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
tempfile = "3"

# Every module behind a feature so each one can be checked alone
# (`cargo check -p omp-stats --no-default-features --features parser`)
# while sibling modules are still being written. Edges = TS import graph.
[features]
default = ["server"]
types = []
taxonomy = []
catalog = []
user_metrics = []
port_conflict = []
parser = ["types", "taxonomy", "user_metrics"]
db = ["types", "catalog"]
db_ingest = ["db", "parser"]
db_query = ["db"]
rollup = ["db"]
aggregator = ["db_ingest", "db_query", "rollup"]
trace = ["rollup", "parser"]
gain = ["aggregator"]
frustration = ["aggregator"]
live = ["aggregator"]
server = ["gain", "frustration", "live", "trace", "port_conflict"]
