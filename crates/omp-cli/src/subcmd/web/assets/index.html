<!doctype html>
<html lang="en" data-theme="calm">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omt</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/maps.css">
<link rel="stylesheet" href="/assets/sidebar.css">
<link rel="stylesheet" href="/assets/agents.css">
<link rel="stylesheet" href="/assets/composer.css">
<link rel="stylesheet" href="/assets/annotate.css">
<link rel="stylesheet" href="/assets/artifacts.css">
<link rel="stylesheet" href="/assets/stream.css">
    <link rel="stylesheet" href="/assets/panes.css">
<link rel="stylesheet" href="/assets/palette.css">
<link rel="stylesheet" href="/assets/tasks.css">
<link rel="stylesheet" href="/assets/changes.css">
<link rel="stylesheet" href="/assets/workspaces.css">
<link rel="stylesheet" href="/assets/quick.css">
<link rel="stylesheet" href="/assets/terminal.css">
</head>
<body>
<div id="wallpaper" aria-hidden="true"></div>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <div class="brand"><span class="tau-brand" data-tau="idle" data-size="30"></span><span class="wordmark">OMT</span></div>
      <button class="icon-btn" id="sidebar-hide" title="Hide sidebar (Ctrl+B)" aria-label="Hide sidebar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="m15 9-3 3 3 3"/></svg></button>
      <button class="icon-btn" id="appearance-btn" title="Themes &amp; wallpapers (Ctrl+Shift+A)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.75 1.5-1.67 0-.44-.17-.84-.44-1.13-.29-.29-.44-.68-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.56-2.5 5.56-5.55C21.96 6.01 17.46 2 12 2z"/></svg></button>
    </div>
    <button class="primary wide compact" id="new-session">+ New session</button>
    <div class="side-section grow">
      <div class="side-title">
        <span>Sessions</span>
        <span class="side-title-btns">
          <button class="link-btn" id="group-toggle" title="Grouped by date — switch to project groups" hidden>by date</button>
          <button class="link-btn" id="project-pick" title="Change folder">folder ▾</button>
        </span>
      </div>
      <div id="project-path" class="muted small ellipsis"></div>
      <input id="session-filter" class="filter" placeholder="Search all sessions…" title="Search the live fleet and every project's stored history (title and preview)" autocomplete="off">
      <div id="session-list" class="list scroll"></div>
    </div>
    <div class="side-section">
      <div class="side-title">Карты</div>
      <button class="side-link" id="maps-btn" title="Карты кода">Карты</button>
    </div>
    <div id="agent-dock" class="agent-dock" aria-label="Session activity"></div>
  </aside>
  <main id="main">
    <header id="topbar">
      <button class="icon-btn" id="sidebar-toggle" title="Hide sidebar (Ctrl+B)" aria-label="Toggle sidebar" aria-expanded="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      <div class="title-block">
        <div id="session-title" class="session-title" title="Rename session">omt</div>
        <div id="session-cwd" class="muted small ellipsis"></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="glyph-appearance-btn" title="Activity glyph (brain) — themes &amp; glyph picker"><span aria-hidden="true" style="width:18px;height:15px;background:currentColor;-webkit-mask:var(--brain-glyph) center / contain no-repeat;mask:var(--brain-glyph) center / contain no-repeat"></span></button>
        <button class="icon-btn" id="preview-btn" title="Preview files of this session (Ctrl+Shift+P)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/></svg></button>
        <button class="icon-btn" id="menu-btn" title="Session actions">⋯</button>
      </div>
    </header>
    <section id="transcript-wrap">
      <div id="transcript"></div>
      <div id="empty-state" class="empty-state">
        <div class="logo big"><span class="tau-hero" data-tau="idle" data-size="128"></span></div>
        <h1 class="wordmark big">OMT</h1>
        <div class="katakana">オー・マイ・アールエス</div>
        <p class="muted">Start a new session or pick one from the sidebar.</p>
        <p class="muted small">Type <kbd>/</kbd> for commands · <kbd>!</kbd> runs a shell command · <kbd>Esc</kbd> interrupts</p>
      </div>
      <button id="jump-bottom" class="jump" hidden>↓</button>
    </section>
    <section id="maps-view" class="maps" hidden aria-label="Карты кода">
      <div class="maps-toolbar">
        <div class="maps-mode" role="tablist">
          <button class="tab" data-mode="code" role="tab" aria-selected="true">Код</button>
          <button class="tab" data-mode="kg" role="tab" aria-selected="false">KG</button>
          <button class="tab" data-mode="diagram" role="tab" aria-selected="false">Диаграмма</button>
        </div>
        <div class="maps-filters">
          <input id="maps-search" class="maps-filter" placeholder="Поиск…" autocomplete="off">
          <div id="maps-cluster-chips" class="maps-chips"></div>
          <select id="maps-type-filter" class="maps-filter" hidden></select>
        </div>
        <div class="maps-layout" role="group" aria-label="Лейаут">
          <button class="seg" data-layout="force" aria-pressed="true">Сила</button>
          <button class="seg" data-layout="clusters" aria-pressed="false">Кластеры</button>
        </div>
        <div id="maps-counts" class="maps-counts muted small"></div>
      </div>
      <div id="maps-split">
        <div id="maps-canvas" class="maps-canvas">
          <svg id="maps-svg" class="maps-svg" role="img" aria-label="Граф зависимостей"><g id="maps-g"></g></svg>
          <div id="maps-loading" class="maps-state" hidden></div>
          <div id="maps-empty" class="maps-state" hidden></div>
          <div id="maps-error" class="maps-state" hidden></div>
        </div>
        <aside id="maps-panel" class="maps-detail" hidden></aside>
      </div>
    </section>
    <div id="widgets-above" class="widgets"></div>
    <div id="queue-band" class="queue-band" hidden></div>
    <footer id="composer-wrap">
      <div id="autocomplete" class="autocomplete" hidden></div>
      <div id="attachments" class="attachments"></div>
      <div id="home-head">
        <div class="logo big"><span class="tau-hero" data-tau="idle" data-size="88"></span></div>
        <h1 class="wordmark big">OMT</h1>
        <p class="muted">Start a new session or pick one from the sidebar.</p>
      </div>
      <div class="composer">
        <div class="composer-card">
          <div class="ta-wrap"><div id="composer-hl" class="ta-hl" aria-hidden="true"></div><textarea id="composer" rows="1" placeholder="Ask anything…  (/ commands · ! shell · Enter send · Shift+Enter newline)" disabled></textarea></div>
          <div class="composer-bar">
            <button id="attach-btn" class="icon-btn attach-btn" title="Attach files (images go to the model, other files are saved for the agent to read)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button><button id="mic-btn" class="icon-btn attach-btn mic-btn" title="Dictate (click to start, click again to insert the text · Esc cancels)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg><span class="mic-time" hidden></span></button>
            <button class="chip chip-inline" id="composer-model" title="Model (/model)" disabled>model</button>
            <button class="chip chip-inline effort-chip" id="composer-thinking" title="Thinking level (/effort)" disabled><svg class="effort-icon" viewBox="0 0 20 20" aria-hidden="true"><path class="effort-segment" data-segment="0" d="M11.8 1.6 8.7 6.7h4.1l1-5.1z"/><path class="effort-segment" data-segment="1" d="M7.9 8.1 4.5 12.2h4.9l3.3-4.1z"/><path class="effort-segment" data-segment="2" d="M8.8 13.6 7.7 18.5l5.1-6.5H9.6z"/></svg><span class="effort-label">thinking</span></button>
            <button id="send-btn" class="send-btn" disabled title="Send (Enter)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg></button>
            <button id="stop-btn" class="danger send-btn" hidden title="Interrupt (Esc)"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
          </div>
          <div id="statusbar" class="statusbar"></div>
        </div>
      </div>
      <input type="file" id="file-input" multiple hidden>
      <div id="widgets-below" class="widgets"></div>
    </footer>
  </main>
  <aside id="subagents-sidebar" aria-label="Todo and subagents">
    <div class="activity-panel-head">
      <span class="activity-panel-title">Activity</span>
      <button class="icon-btn" id="activity-collapse" title="Collapse Todo and subagents" aria-label="Collapse activity panel" aria-expanded="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <button class="icon-btn" id="activity-expand" title="Show Todo and subagents" aria-label="Expand activity panel" hidden><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <div id="subagents-dock" class="subagents-dock"></div>
  </aside>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script src="/assets/util.js"></script>
<script src="/assets/mascot.js"></script>
<script src="/assets/markdown.js"></script>
<script src="/assets/tools.js"></script>
<script src="/assets/transcript.js"></script>
<script src="/assets/dialogs.js"></script>
<script src="/assets/annotate.js"></script>
<script src="/assets/composer.js"></script>
<script src="/assets/agents.js"></script>
<script src="/assets/appearance.js"></script>
<script src="/assets/models.js"></script>
<script src="/assets/sidebar.js"></script>
<script src="/assets/artifacts.js"></script>
<script src="/assets/shell.js"></script>
<script src="/assets/palette.js"></script>
<script src="/assets/tasks.js"></script>
<script src="/assets/changes.js"></script>
<script src="/assets/terminal.js"></script>
<script src="/assets/workspaces.js"></script>
<script src="/assets/quick.js"></script>
<script src="/assets/maps.js"></script>
<script src="/assets/panes.js"></script>
    <script src="/assets/app.js"></script>
<script src="/assets/desktop-bridge.js"></script>
</body>
</html>
