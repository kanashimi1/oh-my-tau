<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
<!-- Sakura night: a blossom bough crosses the full moon; quiet hills below carry a
     single drift of petals. Flat shapes only; palette: indigo night, moonlight ivory,
     branch ink, blossom pink. -->
<defs>
  <path id="pt" d="M0,0 C-8,-8 -10,-19 -4,-24 L0,-20 L4,-24 C10,-19 8,-8 0,0 Z" fill="#ef9dc0"/>
  <g id="fl">
    <use href="#pt"/>
    <use href="#pt" transform="rotate(72)"/>
    <use href="#pt" transform="rotate(144)"/>
    <use href="#pt" transform="rotate(216)"/>
    <use href="#pt" transform="rotate(288)"/>
    <circle r="3.4" fill="#d4699b"/>
  </g>
</defs>
<rect width="1920" height="1080" fill="#171433"/>
<rect y="840" width="1920" height="240" fill="#1e1a42"/>
<g fill="#f4e8cf" opacity=".5">
  <circle cx="300" cy="130" r="2"/><circle cx="420" cy="225" r="1.5"/><circle cx="560" cy="95" r="2.2"/>
  <circle cx="690" cy="185" r="1.6"/><circle cx="240" cy="305" r="1.4"/><circle cx="520" cy="330" r="1.8"/>
  <circle cx="820" cy="120" r="1.5"/><circle cx="940" cy="250" r="1.3"/><circle cx="120" cy="180" r="1.6"/>
</g>
<circle cx="1230" cy="430" r="230" fill="#f4e8cf"/>
<g fill="#e9dab9">
  <circle cx="1170" cy="360" r="26"/><circle cx="1290" cy="480" r="38"/>
  <circle cx="1258" cy="348" r="13"/><circle cx="1320" cy="330" r="10"/><circle cx="1140" cy="490" r="18"/>
</g>
<!-- the bough: enters from the top edge, curves across the moon, tapers to a tip -->
<path fill="#241d2e" d="M1518,-40
  C1408,116 1300,238 1188,330
  C1128,380 1078,452 1042,532
  C1038,544 1044,552 1054,550
  C1094,472 1140,406 1200,344
  C1312,232 1424,110 1562,-14 Z"/>
<!-- fork limb up-left, hugging the bough -->
<path fill="#241d2e" d="M1236,334
  C1200,280 1170,220 1146,146
  C1152,136 1162,130 1172,132
  C1196,204 1226,264 1262,318 Z"/>
<g stroke="#241d2e" fill="none" stroke-linecap="round">
  <path d="M1146,148 C1156,124 1172,106 1200,94" stroke-width="8"/>
  <path d="M1368,186 C1394,154 1426,132 1468,120" stroke-width="9"/>
</g>
<g fill="#d4699b">
  <circle cx="1210" cy="296" r="6"/><circle cx="1186" cy="330" r="6"/>
  <circle cx="1162" cy="188" r="5"/><circle cx="1400" cy="166" r="5"/>
</g>
<!-- blossom clusters -->
<g>
  <use href="#fl" transform="translate(1128,318) scale(1.2)"/>
  <use href="#fl" transform="translate(1166,352) rotate(28) scale(.95)"/>
  <use href="#fl" transform="translate(1096,356) rotate(-24) scale(.85)"/>
  <use href="#pt" fill="#f8cfe0" transform="translate(1128,318) scale(1.2)"/>
  <use href="#fl" transform="translate(1044,546) scale(1.15)"/>
  <use href="#fl" transform="translate(1014,516) rotate(48) scale(.85)"/>
  <use href="#fl" transform="translate(1076,582) rotate(-38) scale(.8)"/>
  <use href="#pt" fill="#f8cfe0" transform="translate(1044,546) scale(1.15)"/>
  <use href="#fl" transform="translate(1118,136) scale(1)"/>
  <use href="#fl" transform="translate(1188,92) rotate(30) scale(.85)"/>
  <use href="#fl" transform="translate(1474,116) scale(.95)"/>
  <use href="#fl" transform="translate(1502,146) rotate(-20) scale(.75)"/>
</g>
<!-- hills -->
<path fill="#14112b" d="M0,912 C300,884 560,902 860,934 C1160,966 1500,942 1920,956 L1920,1080 L0,1080 Z"/>
<path fill="#0f0d20" d="M0,960 C220,918 480,916 760,948 C1080,984 1400,1004 1920,1012 L1920,1080 L0,1080 Z"/>
<!-- one wind current, branch tip to lower left -->
<g fill="#ef9dc0">
  <use href="#pt" transform="translate(1000,612) scale(.7) rotate(30)"/>
  <use href="#pt" transform="translate(902,694) scale(.6) rotate(-25)"/>
  <use href="#pt" transform="translate(798,762) scale(.55) rotate(70)"/>
  <use href="#pt" transform="translate(688,822) scale(.45) rotate(120)"/>
  <use href="#pt" transform="translate(584,868) scale(.4) rotate(-10)"/>
  <use href="#pt" transform="translate(430,922) scale(.35) rotate(45)"/>
  <use href="#pt" transform="translate(318,930) scale(.3) rotate(-60)"/>
</g>
</svg>
