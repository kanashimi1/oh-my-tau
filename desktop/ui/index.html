<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>omt</title>
<style>
  :root { color-scheme: dark; --bg:#141018; --fg:#e8e2ee; --mut:#8f879c; --acc:#a483e0; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg);
    font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  body { display:flex; align-items:center; justify-content:center; }
  #box { text-align:center; max-width:420px; padding:24px; }
  .tau { width:64px; height:64px; display:block; margin:0 auto 18px; }
  h1 { margin:0 0 8px; font-weight:600; letter-spacing:.08em; }
  p { margin:0; color:var(--mut); }
  .spin { width:26px; height:26px; margin:0 auto 20px; border:3px solid #2a2333;
    border-top-color:var(--acc); border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div id="box">
    <div class="spin" id="spinner"></div>
    <svg class="tau" viewBox="8 12 48 46" aria-label="τ"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="oklch(0.7 0.24 340)"/><stop offset="0.5" stop-color="oklch(0.62 0.21 295)"/><stop offset="1" stop-color="oklch(0.81 0.14 200)"/></linearGradient></defs><path fill="url(#g)" d="M10 14h44v9H37v24h13v9H28V23H10z"/></svg>
    <h1>OMT</h1>
    <p id="status">Connecting to the local omt service…</p>
  </div>
  <script>
    // Called from Rust when the service never comes up.
    window.showInitError = function (msg) {
      document.getElementById("spinner").style.display = "none";
      document.getElementById("status").textContent =
        msg || "Could not reach the omt service. Start `systemctl --user start omp-rs-web` and reopen.";
      document.getElementById("status").style.color = "#e07878";
    };
  </script>
</body>
</html>
