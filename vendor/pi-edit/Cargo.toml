[package]
name = "pi-edit"
version = "18.9.1"
edition = "2024"
license = "MIT"
authors = ["Stencil Labs, Inc."]
description = "Vendored from can1357/oh-my-pi (MIT), see ../LICENSE-oh-my-pi."

[dependencies]
async-trait = "0.1"
parking_lot = "0.12"
pi-ast = { path = "../pi-ast" }
pi-diff = { path = "../pi-diff" }
pi-walker = { path = "../pi-walker" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh64", "xxh32"] }
