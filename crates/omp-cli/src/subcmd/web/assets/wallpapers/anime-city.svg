  <rect x="1740" y="690" width="180" height="70"/>
  <rect y="758" width="1920" height="322"/>
</g>
<path d="M1060,528 V474" stroke="#3c2f5c" stroke-width="5" fill="none"/>
<circle cx="1060" cy="468" r="5" fill="#f5b26b"/>
<!-- harbour crane above the near skyline -->
<g stroke="#251c3e" stroke-width="8" fill="none">
  <path d="M870,864 V696"/>
  <path d="M782,716 H965"/>
  <path d="M870,696 L965,716"/>
  <path d="M782,716 V742"/>
</g>
<!-- near city, one mass -->
