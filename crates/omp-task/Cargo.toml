[package]
name = "omp-task"
# `+a2agitflow` build metadata: with three batch-2 workers sharing
# CARGO_TARGET_DIR across worktrees, identical package ids produce identical
# artifact filenames and clobber each other's fingerprints (a foreign build
# of this crate leaves dep-info pointing at the foreign tree, so local edits
# never invalidate the shared rlib). The unique version keeps this tree's
# artifacts in their own fingerprint slot. Drop the suffix at merge.
version = "0.10.0+a2agitflow"
edition.workspace = true
license.workspace = true
description = "Subagent task tool for omp-rs: agent-definition discovery and task spawning"

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true }
jsonschema = "0.29"
parking_lot = "0.12"

[target.'cfg(unix)'.dependencies]
# Process-group SIGKILL for cancelled child runs (safe wrapper; the workspace
# forbids `unsafe`). Same version/features as omp-eval.
nix = { version = "0.29", default-features = false, features = ["signal"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# Lock convention: see the workspace root manifest.
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
