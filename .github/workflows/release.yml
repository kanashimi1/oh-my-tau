name: Release

on:
  push:
    tags: ["v*"]
  # Re-run the build for an existing tag (binaries are built from the tag's source).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build, e.g. v0.11.0"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # Keep build-machine paths (cargo registry, toolchain, checkout) out of the
  # binaries; mirrors scripts/release.sh.
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            asset: omt-linux-x64
            strip: objcopy
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: omt-linux-arm64
            strip: objcopy
          # Fully static Linux builds (any distro, incl. Alpine); no ONNX Runtime.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: omt-linux-x64-musl
            strip: copy
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            asset: omt-linux-arm64-musl
            strip: copy
            musl: true
          - target: x86_64-apple-darwin
            runner: macos-14  # Intel runners are retired; cross-compile on Apple silicon
            asset: omt-macos-x64
            strip: strip
            # No prebuilt ONNX Runtime for Intel macOS: build without the Laya ONNX heads.
            cargo_args: --no-default-features
          - target: aarch64-apple-darwin
            runner: macos-14
            asset: omt-macos-arm64
            strip: strip
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: omt-windows-x64.exe
            strip: none
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The prebuilt onnxruntime (ort) calls `__isPlatformVersionAtLeast`, which
      # lives in clang's compiler-rt; rustc links with -nodefaultlibs, so add it.
      - name: macOS compiler-rt
        if: runner.os == 'macOS'
        shell: sh
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=13.4" >> "$GITHUB_ENV"
          echo "OMT_MAC_LINK=-C link-arg=$(xcrun clang --print-resource-dir)/lib/darwin/libclang_rt.osx.a" >> "$GITHUB_ENV"
      # Build tooling from the workflow's commit (fixes apply to re-runs of older tags).
      - uses: actions/checkout@v4
        if: matrix.musl
        with:
          ref: ${{ github.sha }}
          path: _wf
          sparse-checkout: scripts
      - uses: mlugg/setup-zig@v1
        if: matrix.musl
        with:
          version: 0.13.0
      - name: Build (musl, static)
        if: matrix.musl
        shell: sh
        run: |
          reg="${CARGO_HOME:-$HOME/.cargo}/registry/src"
          OMT_EXTRA_RUSTFLAGS="-C strip=debuginfo --remap-path-prefix=${reg}=/cargo/registry/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/git/checkouts=/cargo/git --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup --remap-path-prefix=$(pwd)=/omt" \
            _wf/scripts/build-musl.sh "$(echo ${{ matrix.target }} | cut -d- -f1)"
          file "target/${{ matrix.target }}/release/omt" | grep -q "statically linked"
          "target/${{ matrix.target }}/release/omt" --version
      - name: Build
        if: ${{ !matrix.musl }}
        shell: sh
        run: |
          reg="${CARGO_HOME:-$HOME/.cargo}/registry/src"
          RUSTFLAGS="${OMT_MAC_LINK:-} --remap-path-prefix=${reg}=/cargo/registry/src --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}/git/checkouts=/cargo/git --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup --remap-path-prefix=$(pwd)=/omt" \
            cargo build --release --target ${{ matrix.target }} -p omp-cli ${{ matrix.cargo_args }}
      - name: Package
        shell: sh
        run: |
          mkdir -p dist
          case "${{ matrix.strip }}" in
            copy)    cp "target/${{ matrix.target }}/release/omt" "dist/${{ matrix.asset }}" ;;
            objcopy) objcopy --strip-debug "target/${{ matrix.target }}/release/omt" "dist/${{ matrix.asset }}" ;;
            strip)   strip "target/${{ matrix.target }}/release/omt" && cp "target/${{ matrix.target }}/release/omt" "dist/${{ matrix.asset }}" ;;
            *)       cp "target/${{ matrix.target }}/release/omt.exe" "dist/${{ matrix.asset }}" ;;
          esac
          chmod +x "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    # Publish whatever built: one unsupported target must not block the rest.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum omt-* > SHA256SUMS.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create "${RELEASE_TAG}" --repo "${{ github.repository }}" --title "omt ${RELEASE_TAG}" --generate-notes
          gh release upload "${RELEASE_TAG}" dist/* --repo "${{ github.repository }}" --clobber
